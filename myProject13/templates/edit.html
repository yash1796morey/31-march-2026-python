{% extends 'base.html' %}

{% block content %}

<h2>Edit Contact</h2>

<form method="POST">
    {% csrf_token %}

    Name: <input type="text" name="name" value="{{ data.name }}"><br><br>
    Email: <input type="email" name="email" value="{{ data.email }}"><br><br>
    Message: <textarea name="message">{{ data.message }}</textarea><br><br>

    <button type="submit">Update</button>
</form>

{% endblock %}
