{% extends 'base.html' %}

{% block content %}

<h2>All Contacts</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Message</th>
        <th>Action</th>
    </tr>

    {% for i in data %}
    <tr>
        <td>{{ i.id }}</td>
        <td>{{ i.name }}</td>
        <td>{{ i.email }}</td>
        <td>{{ i.message }}</td>

        <td>
            <a href="/edit/{{ i.id }}">Edit</a>
            <a href="/delete/{{ i.id }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
